[server]
# Serves ./static at /app/static so IBM Plex is not a venue-wifi dependency.
enableStaticServing = true

[theme]
base = "light"

# Trust navy is the only primary. Amber is the only accent and is reserved for
# human-attention states. See src/precedent/ui_theme.py for the Python mirror.
primaryColor = "#1E3A8A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1E3A8A"
linkUnderline = true
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true

dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
codeTextColor = "#334155"

font = "IBM Plex Sans, sans-serif"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.8125rem"
headingFontSizes = ["1.75rem", "1.25rem", "1.0625rem"]
headingFontWeights = [600, 600, 600]
metricValueFontSize = "1.625rem"
metricValueFontWeight = 600

# Amber accent. Streamlit's yellow and orange families are collapsed onto the
# single accent so the app cannot show two competing warm colors.
yellowColor = "#A16207"
yellowBackgroundColor = "#FEF3C7"
yellowTextColor = "#92400E"
orangeColor = "#A16207"
orangeBackgroundColor = "#FEF3C7"
orangeTextColor = "#92400E"

blueColor = "#1E3A8A"
blueBackgroundColor = "#DBEAFE"
blueTextColor = "#1E40AF"
greenColor = "#166534"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#166534"
redColor = "#991B1B"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
grayColor = "#475569"
grayBackgroundColor = "#F1F5F9"
grayTextColor = "#475569"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
borderColor = "#E2E8F0"
textColor = "#0F172A"
showWidgetBorder = true

# IBM Plex, self-hosted from ./static/fonts (latin subset, Google Fonts build).
# Sans is a variable file covering 100-700; Mono ships one file per weight.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-400.woff2"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-500.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-600.woff2"
weight = "600"
style = "normal"
