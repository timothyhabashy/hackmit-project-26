[server]
# Serves ./static at /app/static so IBM Plex is not a venue-wifi dependency.
enableStaticServing = true

[client]
# Viewer chrome: hide Deploy / rerun / cache on localhost. Dataframe CSV
# download is off; row selection stays (D007).
toolbarMode = "viewer"
disableDataExport = true

[theme]
base = "light"

# Ink/paper tokens. Python constants in src/precedent/ui_theme.py must stay
# byte-aligned on these hex values. Amber is the only accent and is reserved
# for unexplained money / needs a human.
primaryColor = "#1E3A5F"
backgroundColor = "#F3EEE4"
secondaryBackgroundColor = "#E8E1D4"
textColor = "#1A1612"
linkColor = "#1E3A5F"
linkUnderline = true
borderColor = "#D4CBBA"
showWidgetBorder = true
showSidebarBorder = true

dataframeBorderColor = "#D4CBBA"
dataframeHeaderBackgroundColor = "#E8E1D4"
codeBackgroundColor = "#E8E1D4"
codeTextColor = "#5A544C"

font = "IBM Plex Sans, sans-serif"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.8125rem"
headingFontSizes = ["1.375rem", "1.375rem", "1.0625rem"]
headingFontWeights = [600, 600, 600]
metricValueFontSize = "1.625rem"
metricValueFontWeight = 600
baseRadius = "0.125rem"
buttonRadius = "0.125rem"

# Native alerts use paper fills so they do not introduce a second pastel
# palette. Kind is carried by the left rule in ui_theme.py.
yellowColor = "#8A5808"
yellowBackgroundColor = "#FFFBF4"
yellowTextColor = "#8A5808"
orangeColor = "#8A5808"
orangeBackgroundColor = "#FFFBF4"
orangeTextColor = "#8A5808"

blueColor = "#1E3A5F"
blueBackgroundColor = "#FFFBF4"
blueTextColor = "#1E3A5F"
greenColor = "#166534"
greenBackgroundColor = "#FFFBF4"
greenTextColor = "#166534"
redColor = "#991B1B"
redBackgroundColor = "#FFFBF4"
redTextColor = "#991B1B"
grayColor = "#5A544C"
grayBackgroundColor = "#E8E1D4"
grayTextColor = "#5A544C"

[theme.sidebar]
backgroundColor = "#FFFBF4"
secondaryBackgroundColor = "#E8E1D4"
borderColor = "#D4CBBA"
textColor = "#1A1612"
showWidgetBorder = true

# IBM Plex, self-hosted from ./static/fonts (latin subset, Google Fonts
# static faces). Sans ships 400/500/600 as discrete files, same as Mono.
# The previous Sans file was the variable latin cut registered as
# weight = "100 700"; headings request 600, so real 500/600 files are
# required. Do not faux-bold.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-500.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-600.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-400.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-500.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-latin-600.woff2"
weight = "600"
style = "normal"
